# Installed by autoframe (https://github.com/bhavinpatel47/autoframe)
# One loopback device; autoframe finds it by its label, so the number is left to the kernel.
# exclusive_caps=1 is required for Chrome/Chromium-based apps to list the camera.
options v4l2loopback devices=1 card_label="Autoframe Camera" exclusive_caps=1
